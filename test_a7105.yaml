esphome:
  name: esphome-web-c00e20
  friendly_name: Bed
  min_version: 2025.11.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

packages:
  device: !include a7105.yaml

a7105:
  id: a7105_component
  cs_pin: GPIO5
  data_rate: 133333Hz
  spi_mode: 0

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19
  interface: hardware

script:
  - id: send_head_up
    mode: restart
    then:
      - while:
          condition:
            lambda: "return id(bed_head_up).state;"
          then:
            - lambda: |-
                id(a7105_component).send_payload(
                  { 0x06, 0xB3, 0x4D, 0xB3, 0x4D },
                  { 0x05, 0x55, 0x55, 0x44, 0x44 }
                );
            - delay: 35ms

  - id: send_head_down
    mode: restart
    then:
      - while:
          condition:
            lambda: "return id(bed_head_down).state;"
          then:
            - lambda: |-
                id(a7105_component).send_payload(
                  { 0x06, 0xB3, 0x4D, 0xB3, 0x4D },
                  { 0x05, 0x55, 0x55, 0x55, 0x55 }
                );
            - delay: 35ms

  - id: send_foot_up
    mode: restart
    then:
      - while:
          condition:
            lambda: "return id(bed_foot_up).state;"
          then:
            - lambda: |-
                id(a7105_component).send_payload(
                  { 0x06, 0xB3, 0x4D, 0xB3, 0x4D },
                  { 0x05, 0x55, 0x55, 0x66, 0x66 }
                );
            - delay: 35ms

  - id: send_foot_down
    mode: restart
    then:
      - while:
          condition:
            lambda: "return id(bed_foot_down).state;"
          then:
            - lambda: |-
                id(a7105_component).send_payload(
                  { 0x06, 0xB3, 0x4D, 0xB3, 0x4D },
                  { 0x05, 0x55, 0x55, 0x77, 0x77 }
                );
            - delay: 35ms

  - id: send_flat
    mode: restart
    then:
      - lambda: |-
          id(a7105_component).send_payload(
            { 0x06, 0xB3, 0x4D, 0xB3, 0x4D },
            { 0x05, 0xAA, 0xAA, 0x33, 0x33 }
          );

switch:
  - platform: template
    id: bed_head_up
    name: "Head Up"
    optimistic: false
    turn_on_action:
      - lambda: "id(bed_head_up).publish_state(true);"
      - script.execute: send_head_up
    turn_off_action:
      - lambda: "id(bed_head_up).publish_state(false);"
      - script.stop: send_head_up

  - platform: template
    id: bed_head_down
    name: "Head Down"
    optimistic: false
    turn_on_action:
      - lambda: "id(bed_head_down).publish_state(true);"
      - script.execute: send_head_down
    turn_off_action:
      - lambda: "id(bed_head_down).publish_state(false);"
      - script.stop: send_head_down

  - platform: template
    id: bed_foot_up
    name: "Foot Up"
    optimistic: false
    turn_on_action:
      - lambda: "id(bed_foot_up).publish_state(true);"
      - script.execute: send_foot_up
    turn_off_action:
      - lambda: "id(bed_foot_up).publish_state(false);"
      - script.stop: send_foot_up

  - platform: template
    id: bed_foot_down
    name: "Foot Down"
    optimistic: false
    turn_on_action:
      - lambda: "id(bed_foot_down).publish_state(true);"
      - script.execute: send_foot_down
    turn_off_action:
      - lambda: "id(bed_foot_down).publish_state(false);"
      - script.stop: send_foot_down

  - platform: template
    id: bed_flat
    name: "Flat"
    optimistic: false
    turn_on_action:
      - lambda: "id(bed_flat).publish_state(true);"
      - script.execute: send_flat
    turn_off_action:
      - lambda: "id(bed_flat).publish_state(false);"
      - script.stop: send_flat

# Enable logging
logger:

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
